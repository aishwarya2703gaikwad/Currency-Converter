<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-align: center;
           text-shadow: 2px 2px 2px rgb(90, 125, 229);
           color: rgb(0, 0, 193);
        }

        .converter{
            width: 500px;
            height: 300px;
            background-color: rgb(108, 108, 234);
            align-content: center;
            padding: 50px;
    
            

        }

        input{
            width: 300px;
            padding: 7px;
            
        }
        select{
            width: 315px;
            padding: 7px;
        }
        button{
            margin-top: 10px;
            padding: 7px;
        }
    </style>
</head>
<body>
    <h1>Currency Convertor</h1>
    <center>
    <div class="converter">
    <input type="number" id="amount" placeholder="Enter amount"><br><br>
    <select id="from"><br><br>
      <option value="PKR">PKR</option>
      <option value="USD">USD</option>
      <option value="AED">AED</option>
      <option value="INR">INR</option>
    </select><br><br>
    <select id="to">
      <option value="PKR">PKR</option>
      <option value="USD">USD</option>
      <option value="AED">AED</option>
      <option value="INR">INR</option>
      
    </select><br><br>
    <button onclick="convert()">Convert</button>
    <span id="result"></span>
  </div>
  </center>

  <script>
    async function convert() {
        let amount = document.getElementById("amount").value;
        let from = document.getElementById("from").value;
        let to = document.getElementById("to").value;
        let result = document.getElementById("result").value;

        if(amount === "" || amount <=0){
            alert("Enter the valid amount");
            return;
        }

        let url = `https://open.er-api.com/v6/latest/${from}`;
        let response = await fetch(url);
        let data = await response.json();
        console.log(data);
        let rate = data.rates[to];
        console.log(rate);
        let converted = (amount*rate).toFixed(2);
        document.getElementById("result").innerHTML = `${amount} ${from} = ${converted} ${to}`;
        
    }
  </script>
    
</body>
</html>
